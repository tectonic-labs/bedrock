[package]
authors = ["Tectonic Labs Developers"]
categories = ["cryptography"]
description = "Tectonic's common cryptography library"
documentation = "https://docs.rs/tectonic-bedrock"
edition = "2024"
exclude = ["CLAUDE.md"]
homepage = "https://github.com/tectonic-labs/bedrock"
keywords = ["post-quantum", "crypto", "signature", "kem"]
license = "MIT OR Apache-2.0"
name = "tectonic-bedrock"
readme = "README.md"
repository = "https://github.com/tectonic-labs/bedrock"
rust-version = "1.95"
version = "0.6.0"

[features]
bird-of-prey = ["dep:curve25519-dalek", "falcon", "hmac", "ml-dsa", "sha2", "zeroize", "kgen", "sign", "vrfy"]
classical-signatures = ["ecdsa-signatures", "ed25519-signatures", "rsa-signatures"]
decp = []
default = ["eth_falcon", "falcon", "ml-dsa", "slh-dsa", "mayo", "decp", "encp", "kgen", "sign", "vrfy", "hhd"]
ecdsa-signatures = ["dep:p256", "dep:p384", "dep:signature", "p256/ecdsa", "p256/pkcs8", "p384/ecdsa", "p384/pkcs8", "sha2", "zeroize"]
ed25519-signatures = ["dep:ed25519-dalek", "dep:signature", "zeroize"]
encp = []
eth_falcon = ["falcon", "rand_chacha", "rand_core", "fn-dsa-comm/eth_falcon", "fn-dsa-sign?/eth_falcon", "fn-dsa-vrfy?/eth_falcon", "zeroize"]
falcon = ["fn-dsa-comm"]
frodo = ["dep:frodo-kem-rs", "rand_core_010", "getrandom_v04"]
hashing = ["dep:blake2", "dep:blake3", "sha2", "sha3", "shake"]
hhd = ["zeroize", "bip32", "hmac", "sha2", "tiny-bip39", "rand_core", "kgen"]
hqc = ["dep:hqc-kem", "rand_core_010", "getrandom_v04"]
key-agreement = ["dep:p256", "dep:p384", "random", "x25519-dalek", "x25519-dalek/zeroize", "zeroize"]
kgen = ["fn-dsa-comm", "fn-dsa-kgen", "rand_core", "rand_core/getrandom"]
mayo = ["dep:pq-mayo", "dep:signature", "rand_core_010", "getrandom_v04"]
# Deprecated: legacy interoperability only, including McEliece-based X-Wing.
mceliece = ["dep:pq-mceliece", "rand_core_010", "getrandom_v04"]
ml-dsa = ["dep:ml-dsa", "rand_core_010", "getrandom_v04"]
ml-kem = ["dep:ml-kem"]
random = ["getrandom_v04"]
rsa-signatures = ["dep:rsa", "dep:signature", "random", "rand_core_010", "sha2", "zeroize"]
sign = ["fn-dsa-comm", "fn-dsa-sign", "rand_core", "rand_core/getrandom"]
slh-dsa = ["dep:slh-dsa", "rand_core_010", "getrandom_v04"]
sntrup = ["dep:sntrup", "rand_core_010", "getrandom_v04"]
symmetric = ["dep:aes", "dep:aes-gcm", "dep:chacha20", "dep:chacha20poly1305", "dep:hkdf", "hmac", "sha2", "zeroize"]
vrfy = ["fn-dsa-comm", "fn-dsa-vrfy"]
xmss = ["dep:pq-xmss", "rand_core_010", "getrandom_v04", "zeroize"]
xmss-extra-depths = ["xmss", "pq-xmss/extra-depths"]
xwing = ["rand_core_010", "getrandom_v04", "sha3", "shake", "x25519-dalek"]

[dependencies]
aes = { version = "0.9.3", default-features = false, features = ["zeroize"], optional = true }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"], optional = true }
bip32 = { version = "0.5.3", features = ["std", "secp256k1"], optional = true }
blake2 = { default-features = false, optional = true, version = "0.11.0" }
blake3 = { default-features = false, features = ["pure"], optional = true, version = "1.8.7" }
chacha20 = { version = "0.10.2", default-features = false, features = ["cipher", "zeroize"], optional = true }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"], optional = true }
curve25519-dalek = { version = "5", default-features = false, features = ["alloc", "zeroize"], optional = true }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast", "pkcs8", "signature", "zeroize"], optional = true }
frodo-kem-rs = { version = "0.9", default-features = false, features = ["frodo"], optional = true }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["sys_rng"], optional = true }
hkdf = { version = "0.13.0", optional = true }
hmac = { version = "0.13", features = ["zeroize"], optional = true }
hqc-kem = { version = "=0.1.0-rc.0", default-features = false, features = ["alloc", "dcap", "ecap", "kgen"], optional = true }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"], optional = true }
ml-kem = { version = "0.3.2", default-features = false, features = ["alloc", "zeroize", "getrandom"], optional = true }
p256 = { version = "0.14.0", default-features = false, features = ["alloc", "arithmetic", "ecdh", "std"], optional = true }
p384 = { version = "0.14.0", default-features = false, features = ["alloc", "arithmetic", "ecdh", "std"], optional = true }
pq-mayo = { version = "0.5.0", optional = true }
pq-xmss = { version = "0.2.0", optional = true }
rand_chacha = { version = "0.10", optional = true }
# FN-DSA 0.3 still exposes rand_core 0.6 traits; retain this dependency until
# that API migrates while newer cryptographic backends use rand_core_010.
rand_core = { version = "0.6", features = ["std"], optional = true }
rand_core_010 = { package = "rand_core", version = "0.10", optional = true }
rsa = { version = "0.10.0-rc.18", default-features = false, features = ["encoding", "sha2", "std"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serdect = "0.4"
sha2 = { version = "0.11", optional = true }
sha3 = { version = "0.12", optional = true }
shake = { version = "0.1", optional = true }
signature = { version = "3", optional = true }
slh-dsa = { version = "=0.2.0-rc.5", features = ["zeroize"], optional = true }
sntrup = { version = "0.4.0", default-features = false, features = ["dcap", "ecap", "kgen"], optional = true }
thiserror = "2.0"
tiny-bip39 = { version = "2.0.0", optional = true }
x25519-dalek = { version = "3.0", features = ["getrandom", "static_secrets"], optional = true }
zeroize = { version = "1.8", optional = true }

[dependencies.pq-mceliece]
default-features = false
features = [
    "iso",
    "kem",
    "mceliece348864",
]
optional = true
version = "0.2.1"

[dependencies.fn-dsa-comm]
optional = true
package = "tectonic-fn-dsa-comm"
version = "0.3.0"

[dependencies.fn-dsa-kgen]
optional = true
package = "tectonic-fn-dsa-kgen"
version = "0.3.0"

[dependencies.fn-dsa-sign]
optional = true
package = "tectonic-fn-dsa-sign"
version = "0.3.0"

[dependencies.fn-dsa-vrfy]
optional = true
package = "tectonic-fn-dsa-vrfy"
version = "0.3.0"

[dev-dependencies.fn-dsa]
package = "tectonic-fn-dsa"
version = "0.3.0"

[dev-dependencies]
ciborium = "0.2.2"
criterion = "0.8"
falcon-rust = "0.1.3"
hex = "0.4"
postcard = { version = "1.0", default-features = false, features = ["use-std"] }
rand = "0.10"
rand_chacha = "0.10"
rstest = "0.26"
serde_json = "1.0"
toml = "0.8"
yaml_serde = "0.10"

[lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused = "warn"

[lints.clippy]
mod_module_files = "deny"
unwrap_used = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
harness = false
name = "xwing"
path = "benches/xwing.rs"
required-features = ["mceliece", "ml-kem", "xwing"]

[[bench]]
harness = false
name = "falcon"
path = "benches/falcon.rs"
required-features = ["eth_falcon", "falcon", "kgen", "sign", "vrfy"]
