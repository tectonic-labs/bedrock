name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example, v0.3.0)'
        required: true
        type: string
      dry_run:
        description: 'Run with --dry-run?'
        required: true
        type: boolean
        default: false

jobs:
  publish:
    name: Publish Selected Tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not a valid SemVer tag (for example, v0.3.0)."
            exit 1
          fi

      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.toml to Tag Name
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Syncing Cargo.toml version to: $VERSION"
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          grep "^version =" Cargo.toml

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          FLAGS="--allow-dirty"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          cargo publish $FLAGS
