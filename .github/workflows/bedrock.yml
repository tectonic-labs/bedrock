name: Bedrock

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - rustfmt.toml
      - .pants-ignore
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - rustfmt.toml
      - .pants-ignore

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_LOG_STYLE: always
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-features -- -D warnings

  conventional-signature-features:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature:
          - ecdsa-signatures
          - ed25519-signatures
          - rsa-signatures
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --lib --no-default-features --features "${{ matrix.feature }}" -- -D warnings

  hashing-features:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.95", stable]
        features: [hashing, "hashing,symmetric"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - run: cargo clippy --locked --lib --no-default-features --features "${{ matrix.features }}" -- -D warnings
      - run: cargo test --locked --lib --no-default-features --features "${{ matrix.features }}"
      - run: cargo test --locked --doc --no-default-features --features "${{ matrix.features }}"

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo doc --all-features

  # deps:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: dtolnay/rust-toolchain@nightly
  #     - run: cargo install cargo-udeps
  #     - run: cargo udeps --all-features --all-targets

  # outdated:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: dtolnay/rust-toolchain@nightly
  #     - run: cargo install cargo-outdated
  #     - run: cargo outdated --root-deps-only --exit-code 1

  pants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: cargo-bins/cargo-binstall@v1.17.7
      - run: cargo binstall --no-confirm cargo-pants
      - run: cargo pants --loud --dev

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo test --release --no-fail-fast
